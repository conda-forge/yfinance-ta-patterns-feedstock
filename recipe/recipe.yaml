context:
  version: "0.3.53"

package:
  name: yfinance-ta-patterns
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/y/yfinance_ta_patterns/yfinance_ta_patterns-${{ version }}.tar.gz
  sha256: f1571bc56d9e689c8f3218e5068c231c6fd1a105227a442cd8f8fa95a528375b

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68
  run:
    - python >=${{ python_min }}
    - pandas >=1.3.0
    - numpy >=1.20
    - pytz >=2022.5
    - rich >=10.0.0
    - yfinance >=0.2.54

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - yfinance_ta_patterns
        - yfinance_ta_patterns.mcp_server
        - yfinance_ta_patterns.economic_calendar
      pip_check: true
  - script:
      - python -m yfinance_ta_patterns.cli --help
      - python -m yfinance_ta_patterns.mcp_server --help

about:
  homepage: https://github.com/eminsk/yfinance-ta-patterns
  summary: Institutional-grade market candlestick pattern scanner with multi-asset backtesting and AI confluence scoring
  description: |
    Institutional-grade market candlestick pattern scanner with multi-asset
    backtesting, AI confluence scoring, and LLM market intelligence.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/eminsk/yfinance-ta-patterns
  documentation: https://github.com/eminsk/yfinance-ta-patterns#readme

extra:
  recipe-maintainers:
    - eminsk
